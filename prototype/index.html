<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recapp 原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Outfit:wght@700&display=swap" rel="stylesheet">
<style>
/* VOICE: a patient friend — warm, short, one thing at a time.
   IDEA: a phone app that turns scattered fragments into one finished page.
   PICTURE: the working app itself, inside a phone, with fragments that float into place.
   COLOUR and TYPE: Recapp tokens — warm surface, ink, one coral action, sun for celebration; Huninn (粉圓) rounded for all text, Outfit only for the wordmark.
   LAYOUT: phone centred, flow map beside it on wide screens; phone fills the screen on mobile. */
:root{color-scheme:light dark;
--surface:light-dark(#F6F5F2,#1C1B2E);--alt:light-dark(#EDEBE6,#2A2940);--raised:light-dark(#FFFFFF,#25243A);
--ink:light-dark(#1C1B2E,#F6F5F2);--muted:light-dark(#5A5A6E,#C9C8D6);--line:light-dark(#D9D6CF,#3A394F);
--coral:light-dark(#E8481F,#FF5A36);--coral-t:light-dark(#B8380F,#FF8466);--sun:#FFB020;--page:light-dark(#E4E1DA,#121120);
--ease:cubic-bezier(.2,.8,.2,1);--display:"Huninn","Noto Sans TC",system-ui,sans-serif;--sans:"Huninn","Noto Sans TC",system-ui,sans-serif;--brand:"Outfit","Huninn",system-ui,sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font:500 16px/1.6 var(--sans);overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.stage{height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding:24px}
.side{width:280px;max-height:844px;overflow:auto;display:flex;flex-direction:column;gap:18px}
.side h1{font:700 30px/1.1 var(--brand);margin:0;letter-spacing:-.5px}.side h1 b{color:var(--coral)}
.side p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.stg{display:flex;flex-direction:column;gap:4px}
.stg h2{font-size:13px;color:var(--muted);margin:10px 0 2px;font-weight:700}
.stg button{display:flex;gap:10px;align-items:center;text-align:left;padding:8px 12px;border-radius:10px;font-size:14px;min-height:40px;transition:background .2s}
.stg button:hover{background:var(--alt)}
.stg button[aria-current=true]{background:var(--ink);color:var(--surface)}
.stg button span{font:600 12px var(--display);opacity:.7;width:26px}
.note{font-size:13px!important;padding:12px 14px;border-radius:12px;background:var(--alt)}
.phone{position:relative;width:390px;height:844px;flex:none;border-radius:48px;border:10px solid #1C1B2E;background:var(--surface);overflow:hidden;isolation:isolate}
@media (max-width:860px){.side{display:none}.stage{padding:0}.phone{width:100%;height:100dvh;border:0;border-radius:0}}
@media (min-width:861px) and (max-height:880px){.phone{transform:scale(calc((100vh - 40px)/844));transform-origin:center}}
/* screens */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--surface)}
.screen.in-r{animation:inR .42s var(--ease) both}.screen.in-l{animation:inL .42s var(--ease) both}
.screen.out-l{animation:outL .42s var(--ease) both;pointer-events:none}.screen.out-r{animation:outR .42s var(--ease) both;pointer-events:none;z-index:2}
.screen.in-up{animation:inUp .45s var(--ease) both;z-index:3}
@keyframes inR{from{transform:translateX(100%)}}@keyframes inL{from{transform:translateX(-30%);opacity:.6}}
@keyframes outL{to{transform:translateX(-30%);opacity:.6}}@keyframes outR{to{transform:translateX(100%)}}
@keyframes inUp{from{transform:translateY(100%)}}
.st{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0)*55ms + 120ms)}
.static .st{animation:none}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.top{height:56px;flex:none;display:grid;grid-template-columns:96px 1fr 96px;align-items:center;padding:0 8px;margin-top:8px}
.top .tt{text-align:center;font-weight:700;font-size:16px}.top .tt.sm{font:600 14px var(--display);color:var(--muted)}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.ib:hover{background:var(--alt)}
.pillbtn{justify-self:end;height:34px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);font-size:13px;font-weight:700;display:flex;align-items:center;gap:4px;white-space:nowrap}
.pillbtn.dark{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pillbtn:disabled{opacity:.35;cursor:default}
.body{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 20px 24px}
.foot{flex:none;padding:12px 20px 28px;display:flex;gap:12px;align-items:center;background:var(--surface)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 20px}
.seg i{height:4px;border-radius:999px;background:var(--line);overflow:hidden;position:relative}
.seg i.on::after{content:"";position:absolute;inset:0;background:var(--ink);border-radius:inherit}
.seg i.grow::after{animation:grow .6s var(--ease) both .25s}
@keyframes grow{from{transform:scaleX(0);transform-origin:left}}
h2.q{font-size:24px;line-height:1.35;margin:28px 0 6px;font-weight:700;text-wrap:balance}
.hint{margin:0 0 20px;color:var(--muted);font-size:14px}
.meta{font-size:13px;color:var(--muted);margin:8px 0 0}
.btn{flex:1;height:54px;border-radius:999px;background:var(--ink);color:var(--surface);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.3;cursor:default;transform:none}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.cta{background:var(--coral);color:#fff;font-size:19px}
.btn.cta.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--coral) 22%,transparent)}}
.skip{padding:0 12px;height:54px;color:var(--muted);font-weight:700;text-decoration:underline;text-underline-offset:4px}
.field{position:relative}
textarea,input.tx{width:100%;border:1.5px solid var(--line);background:var(--raised);border-radius:16px;padding:14px 56px 14px 16px;font-size:16px;line-height:1.6;resize:none;transition:border-color .2s}
textarea:focus,input.tx:focus{border-color:var(--ink);outline:none}
textarea::placeholder,input::placeholder{color:var(--muted)}
.mic{position:absolute;right:8px;bottom:8px;width:44px;height:44px;border-radius:50%;background:var(--alt);display:grid;place-items:center;color:var(--ink);transition:background .2s,color .2s}
.mic:hover{background:var(--coral);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--raised);font-size:14px;display:inline-flex;align-items:center;gap:6px;transition:all .2s var(--ease)}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip.on svg{animation:pop .35s var(--ease)}
.chip.dash{border-style:dashed}
.lbl{font-size:13px;color:var(--muted);font-weight:700;margin:22px 0 10px}
/* tiles */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{position:relative;border:1.5px solid var(--line);background:var(--raised);border-radius:16px;padding:18px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:700;font-size:15px;transition:border-color .2s,transform .2s var(--ease)}
.tile:active{transform:scale(.97)}
.tile .ico{width:44px;height:44px;border-radius:12px;background:var(--alt);display:grid;place-items:center}
.tile.on{border:2px solid var(--ink)}
.badge{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;animation:pop .4s var(--ease)}
.badge svg{width:14px;height:14px;stroke-width:3}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.helper{margin-top:16px;padding:14px 16px;border-radius:16px;background:var(--alt);font-size:14px;color:var(--muted);animation:rise .4s var(--ease)}
/* calendar */
.cal-h{display:flex;align-items:center;justify-content:space-between;font-weight:700;margin:4px 0 8px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:4px;text-align:center}
.cal .wd{font-size:12px;color:var(--muted);padding:6px 0}
.day{height:44px;display:grid;place-items:center;font:500 15px var(--display);position:relative}
.day.rng{background:var(--alt)}.day.s{border-radius:22px 0 0 22px}.day.e{border-radius:0 22px 22px 0}.day.s.e{border-radius:22px}
.day.end b{background:var(--ink);color:var(--surface);animation:pop .35s var(--ease)}
.day b{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:600}
.day.today b{box-shadow:inset 0 0 0 1.5px var(--line)}
.day:disabled{color:var(--line);cursor:default}
.range{margin-top:16px;display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:16px;background:var(--alt);font-size:15px;font-weight:700}
.range small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.range .tot{margin-left:auto;font-size:13px;padding:4px 10px;border-radius:999px;border:1.5px solid var(--line)}
/* rows */
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 14px;border:1.5px solid var(--line);border-radius:16px;background:var(--raised);text-align:left;font-weight:700;margin-bottom:10px;transition:border-color .2s}
.row.on{border:2px solid var(--ink)}
.row .ico{width:38px;height:38px;border-radius:10px;background:var(--alt);display:grid;place-items:center}
.row small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.row .grow{flex:1}
.cb{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:all .2s}
.on .cb{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.cb svg{width:15px;height:15px;stroke-width:3}
.on .cb svg path{stroke-dasharray:24;animation:draw .35s var(--ease) both}
@keyframes draw{from{stroke-dashoffset:24}}
/* checklist */
.ctx{font-size:12px;color:var(--muted);margin:6px 0 0;display:flex;gap:6px;flex-wrap:wrap}
.prog{display:flex;align-items:center;gap:10px;margin:8px 0 18px;font-size:13px;font-weight:700}
.prog .bars{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.prog .bars i{height:5px;border-radius:999px;background:var(--line);position:relative;overflow:hidden}
.prog .bars i.on::after{content:"";position:absolute;inset:0;background:var(--coral)}
.prog .bars i.grow::after{animation:grow .7s var(--ease) both .35s}
.prog.all{color:var(--coral-t)}
.card{position:relative;text-align:left;border:1.5px solid var(--line);background:var(--raised);border-radius:16px;padding:16px;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .2s var(--ease),border-color .2s}
.card:hover{border-color:var(--ink)}.card:active{transform:scale(.97)}
.card .ico{width:40px;height:40px;border-radius:10px;background:var(--alt);display:grid;place-items:center}
.card strong{display:block;font-size:16px}.card small{font-size:12px;color:var(--muted)}
.card.done small{color:var(--coral-t);font-weight:700}
.ring{position:absolute;top:14px;right:14px;width:26px;height:26px;border-radius:50%;border:2px solid var(--line)}
.card.done .ring{border:0;background:var(--coral);color:#fff;display:grid;place-items:center}
.card.done .ring svg{width:15px;height:15px;stroke-width:3}
.card.just .ring{animation:pop .5s var(--ease) .3s both}
.card.just{animation:glow 1.2s var(--ease) .2s}
@keyframes glow{30%{border-color:var(--coral)}}
.saved{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);justify-self:end;white-space:nowrap}
.saved i{width:7px;height:7px;border-radius:50%;background:var(--coral);animation:blink 2s infinite}
@keyframes blink{50%{opacity:.25}}
.nudge{text-align:center;font-size:13px;font-weight:700;margin:0 0 -4px;width:100%;display:flex;justify-content:center;gap:4px;align-items:center}
.nudge svg{width:16px;height:16px;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}
.footcol{flex-direction:column;gap:10px}
/* photos */
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;transition:transform .25s var(--ease)}
.ph svg.sc,.sc{width:100%;height:100%;display:block}
.ph.on{transform:scale(.92)}
.ph.on::after{content:"";position:absolute;inset:0;border:3px solid var(--ink);border-radius:10px}
.ph .num{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:rgba(28,27,46,.25);color:#fff;font:700 13px var(--display);display:grid;place-items:center}
.ph.on .num{background:var(--ink);border-color:#fff;animation:pop .35s var(--ease)}
.ph .vid{position:absolute;left:6px;bottom:6px;font:600 11px var(--display);color:#fff;background:rgba(28,27,46,.6);padding:2px 7px;border-radius:999px;display:flex;align-items:center;gap:3px}
.ph .vid svg{width:10px;height:10px;fill:#fff;stroke:none}
.cnt{font-weight:700;font-size:15px;flex:1}
.soft{font-size:13px;color:var(--coral-t);margin:12px 0 0;font-weight:700;animation:rise .4s var(--ease)}
/* text menu */
.mrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:1.5px solid var(--ink);border-radius:16px;background:var(--raised);margin-bottom:10px;text-align:left;transition:transform .2s var(--ease)}
.mrow:active{transform:scale(.98)}
.mrow .ico{width:40px;height:40px;border-radius:50%;background:var(--alt);display:grid;place-items:center}
.mrow strong{display:block;font-size:15px}.mrow small{color:var(--muted);font-size:13px}
.mrow .grow{flex:1}
.tile.sq{padding:20px 10px;font-size:14px}.tile.sq .ico{border-radius:50%}
/* recall */
.qn{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin:4px 0 10px}
.dots{display:flex;gap:4px}.dots i{width:16px;height:4px;border-radius:999px;background:var(--line);transition:all .3s}.dots i.on{background:var(--ink);width:24px}
.bigph{border-radius:16px;overflow:hidden;aspect-ratio:16/10;animation:zoomIn .6s var(--ease) both}
@keyframes zoomIn{from{transform:scale(1.06);opacity:0}}
.qq{font-size:20px;font-weight:700;margin:18px 0 6px;line-height:1.4}
/* chat */
.msgs{display:flex;flex-direction:column;gap:12px;padding-top:8px}
.m{max-width:80%;padding:12px 14px;border-radius:18px;font-size:15px;line-height:1.55}
.m.b{background:var(--raised);border:1.5px solid var(--line);border-bottom-left-radius:6px;align-self:flex-start}
.m.u{background:var(--ink);color:var(--surface);border-bottom-right-radius:6px;align-self:flex-end}
.m .mph{border-radius:12px;overflow:hidden;aspect-ratio:16/10;margin-bottom:10px}
.m.in{animation:msgIn .4s var(--ease) both}
@keyframes msgIn{from{opacity:0;transform:translateY(10px) scale(.96)}}
.typing{display:flex;gap:4px;padding:16px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{30%{transform:translateY(-5px);opacity:.5}}
.cbar{display:flex;gap:8px;align-items:center;padding:10px 14px 26px;border-top:1px solid var(--line);background:var(--surface)}
.cbar input{flex:1;height:46px;border-radius:999px;border:1.5px solid var(--line);background:var(--raised);padding:0 16px;font-size:16px}
.cbar input:focus{outline:none;border-color:var(--ink)}
.round{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--alt);transition:transform .2s}
.round.dark{background:var(--ink);color:var(--surface)}.round:disabled{opacity:.3}
.round:active{transform:scale(.9)}
/* music */
.trk{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border-radius:16px;border:1.5px solid var(--line);background:var(--raised);margin-bottom:10px;text-align:left;transition:border-color .2s}
.trk.on{border:2px solid var(--ink)}
.cover{width:48px;height:48px;border-radius:10px;overflow:hidden;flex:none}
.trk .grow{flex:1}.trk strong{display:block;font-size:15px}.trk small{color:var(--muted);font-size:13px}
.eq{display:flex;gap:3px;align-items:flex-end;height:18px;width:22px}.eq i{flex:1;background:var(--coral);border-radius:2px;height:30%}
.on .eq i{animation:eq .9s ease-in-out infinite}.on .eq i:nth-child(2){animation-delay:.2s}.on .eq i:nth-child(3){animation-delay:.45s}
@keyframes eq{50%{height:100%}}
.lk{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--alt);margin-top:10px;font-size:14px;animation:rise .35s var(--ease)}
.lk span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* generating */
.gen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px}
.asm{position:relative;width:240px;height:300px}
.frame{position:absolute;inset:0;border-radius:20px;border:2px dashed var(--line);animation:solid 2.4s var(--ease) forwards}
@keyframes solid{80%{border-style:dashed}100%{border:2px solid var(--ink);background:var(--raised)}}
.pc{position:absolute;border-radius:10px;overflow:hidden;animation:fly .9s var(--ease) both}
@keyframes fly{from{transform:translate(var(--fx),var(--fy)) rotate(var(--fr)) scale(.7);opacity:0}}
.pc.l{height:8px;border-radius:999px;background:var(--line)}
.pc.m{display:flex;gap:6px;align-items:center;padding:6px 10px;border-radius:999px;background:var(--alt);font-size:12px;font-weight:700}
.genmsg{font-weight:700;font-size:17px;min-height:28px;text-align:center}
.genmsg span{display:inline-block;animation:rise .4s var(--ease)}
/* final page */
.pt{font-size:24px;font-weight:700;margin:12px 0 2px;line-height:1.3}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:16px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.car>div{flex:0 0 100%;scroll-snap-align:start;aspect-ratio:4/5}
.cw{position:relative;margin-top:14px;animation:rise .6s var(--ease) both .1s}
.cn{position:absolute;top:12px;right:12px;font:600 12px var(--display);background:rgba(28,27,46,.7);color:#fff;padding:3px 10px;border-radius:999px}
.cdots{display:flex;gap:5px;justify-content:center;margin-top:10px}.cdots i{width:6px;height:6px;border-radius:50%;background:var(--line);transition:all .3s}.cdots i.on{background:var(--ink);width:16px;border-radius:999px}
.prose{font-size:16px;line-height:1.85;margin:18px 0 0;white-space:pre-line}
.prose p{margin:0 0 12px;animation:rise .6s var(--ease) both;animation-delay:calc(var(--i)*90ms + 300ms)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.tags span{color:var(--coral-t);font-weight:700;font-size:14px}
.att{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--alt);margin-top:10px;font-size:14px}
.att .grow{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* sheet */
.scrim{position:absolute;inset:0;background:rgba(28,27,46,.45);z-index:20;animation:fade .3s both}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:28px 28px 0 0;padding:14px 20px 28px;animation:inUp .45s var(--ease) both}
.sheet.out{animation:sheetOut .3s var(--ease) both}.scrim.out{animation:fade .3s reverse both}
@keyframes sheetOut{to{transform:translateY(100%)}}
.grab{width:40px;height:5px;border-radius:999px;background:var(--line);margin:0 auto 14px}
.mic-top{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.mic-top time{margin-left:auto;font:600 14px var(--display);color:var(--muted)}
.rec{width:10px;height:10px;border-radius:50%;background:var(--coral);animation:blink 1s infinite}
.rec.off{animation:none;background:var(--muted)}
.wave{display:flex;align-items:center;justify-content:center;gap:4px;height:72px;margin:14px 0}
.wave i{width:5px;border-radius:999px;background:var(--coral);height:10%;transition:height .09s linear}
.tr{min-height:104px;font-size:19px;line-height:1.6;font-weight:700;margin:0 0 8px}
.tr .itm{color:var(--muted)}
.tr .ch{animation:fade .25s both}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--coral);vertical-align:-3px;margin-left:2px;animation:blink .8s infinite}
.mnote{font-size:12px;color:var(--muted);margin:0 0 16px}
.done-ic{width:84px;height:84px;border-radius:50%;background:var(--coral);display:grid;place-items:center;margin:16px auto 12px;animation:pop .5s var(--ease)}
.done-ic svg{width:44px;height:44px;stroke:#fff;stroke-width:3}
.done-ic svg path{stroke-dasharray:30;animation:draw .5s var(--ease) .35s both}
@keyframes draw{from{stroke-dashoffset:30}}
.loader{width:56px;height:56px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--coral);margin:20px auto;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.conf{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:22}
.conf i{position:absolute;top:-12px;width:10px;height:10px;border-radius:50%;animation:fall 1.8s var(--ease) forwards}
@keyframes fall{to{transform:translate(var(--dx),900px) rotate(540deg);opacity:0}}
.toast{position:absolute;left:50%;bottom:110px;z-index:30;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;white-space:nowrap;animation:toast 2.4s var(--ease) both}
@keyframes toast{0%{opacity:0;transform:translate(-50%,12px)}12%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
/* home */
.brand{display:flex;align-items:center;gap:8px;margin-top:18px}
.wm{font:700 24px var(--brand);letter-spacing:-.5px}.wm b{color:var(--coral)}
.home h1{font-size:32px;line-height:1.3;margin:22px 0 4px}
.lead{margin:0;color:var(--muted);font-size:16px}
.hero{position:relative;height:260px;margin:18px 0 14px;border-radius:24px;background:var(--alt);overflow:hidden}
.hero .capbig svg path:nth-child(2){stroke:var(--alt)}.hero .capbig{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);width:150px}
.frag{position:absolute;background:var(--raised);border-radius:12px;padding:8px;border:1.5px solid var(--line);animation:float 5s ease-in-out infinite}
.frag .sc{border-radius:7px;width:64px;height:52px}
@keyframes float{50%{transform:translateY(-10px) rotate(var(--r2,2deg))}}
.capnote{text-align:center;color:var(--muted);font-size:13px;margin:10px 0 0}
.ycard{display:flex;align-items:center;gap:12px;width:100%;margin-top:20px;padding:16px;border-radius:16px;background:var(--sun);color:#1C1B2E;text-align:left}
.ycard small{display:block;font-size:12px;font-weight:700;opacity:.8}.ycard strong{font-size:16px}.ycard .grow{flex:1}
.tabs{flex:none;display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);padding:6px 20px 22px;background:var(--surface)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);font-weight:700;min-height:52px;justify-content:center}
.tabs button[aria-current=true]{color:var(--ink)}
/* library */
.lhd{display:flex;align-items:center;justify-content:space-between;margin:20px 0 14px}
.lhd h1{font-size:24px;margin:0}
.tg{display:flex;padding:3px;border-radius:999px;background:var(--alt);position:relative}
.tg button{position:relative;z-index:1;width:48px;height:34px;font-size:14px;font-weight:700;color:var(--muted);transition:color .3s}
.tg button[aria-pressed=true]{color:var(--surface)}
.tg .knob{position:absolute;top:3px;left:3px;width:48px;height:34px;border-radius:999px;background:var(--ink);transition:transform .35s var(--ease)}
.tg.y .knob{transform:translateX(48px)}
.yban{display:flex;align-items:center;justify-content:space-between;width:100%;padding:16px;border-radius:16px;background:var(--ink);color:var(--surface);font-weight:700;margin-bottom:8px}
.yban span{display:flex;align-items:center;gap:10px}.yban i{width:10px;height:10px;border-radius:50%;background:var(--sun)}
.mon h3{font:700 20px var(--display);margin:20px 0 8px;display:flex;align-items:baseline;gap:8px}
.mon h3 small{font:500 12px var(--sans);color:var(--muted)}
.mon h3 .new{font:700 11px var(--sans);background:var(--sun);color:#1C1B2E;padding:2px 8px;border-radius:999px}
.col{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:76px 76px;gap:6px;width:100%}
.col>div{border-radius:10px;overflow:hidden}.col>div:first-child{grid-row:span 2}
.col.one{grid-template-columns:1fr;grid-template-rows:152px}
.col.hl{animation:glowb 2s var(--ease) .5s}
@keyframes glowb{30%{transform:scale(1.02)}}
.empty{font-size:13px;color:var(--muted);padding:10px 0 4px}
.yr{display:block;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;background:var(--raised)}
.yr.cur{border:2px solid var(--ink)}
.yr h3{display:flex;justify-content:space-between;align-items:center;font:700 24px var(--display);margin:0 0 10px}
.mg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.mg i{aspect-ratio:1;border-radius:8px;background:var(--alt);font:600 10px var(--display);padding:4px;display:flex;align-items:flex-end;font-style:normal;color:var(--muted)}
.mg i.l1{background:color-mix(in srgb,var(--coral) 25%,var(--alt))}.mg i.l2{background:color-mix(in srgb,var(--coral) 55%,var(--alt));color:var(--ink)}.mg i.l3{background:var(--coral);color:#fff}
.mg i.fut{background:transparent;border:1.5px dashed var(--line)}
.th3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.th3>div{aspect-ratio:4/3;border-radius:8px;overflow:hidden}
/* recap */
.rc{position:absolute;inset:0;background:#1C1B2E;color:#F6F5F2;display:flex;flex-direction:column;z-index:5}
.rbars{display:grid;grid-auto-flow:column;gap:4px;padding:18px 16px 0}
.rbars i{height:3px;border-radius:999px;background:rgba(246,245,242,.25);overflow:hidden;position:relative}
.rbars i.done::after,.rbars i.cur::after{content:"";position:absolute;inset:0;background:#F6F5F2;transform-origin:left}
.rbars i.cur::after{animation:prog 5.5s linear both}
@keyframes prog{from{transform:scaleX(0)}}
.rtop{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 0 20px;font-size:13px;color:#C9C8D6}
.rtop .ib:hover{background:#2A2940}
.rs{flex:1;position:relative;padding:20px 24px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.rs .tap{position:absolute;inset:0;display:grid;grid-template-columns:1fr 2fr;z-index:0}
.rs>*:not(.tap){position:relative;z-index:1;pointer-events:none}
.rs .k{font-size:22px;font-weight:700;margin:0;animation:rise .5s var(--ease) both .1s}
.rs .huge{font:700 112px/1 var(--display);letter-spacing:-4px;margin:0;animation:rise .6s var(--ease) both .2s}
.rs .huge small{font-size:36px;letter-spacing:0}
.rs .hl{display:inline;background:var(--sun);color:#1C1B2E;padding:0 6px;border-radius:6px}
.rk{background:#25243A;border-radius:16px;padding:14px 16px;animation:rise .6s var(--ease) both .5s}
.rk h4{margin:0 0 8px;font-size:13px;color:#C9C8D6}
.rk div{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:center;padding:6px 0;font-size:15px;font-weight:700}
.rk b{font:700 18px var(--display)}
.rk em{font-style:normal;font:600 13px var(--display);color:#C9C8D6}
.rbar{height:6px;border-radius:999px;background:#3A394F;grid-column:2/4;margin-top:-4px;overflow:hidden}
.rbar s{display:block;height:100%;background:var(--sun);border-radius:inherit;animation:grow 1s var(--ease) both .8s}
.wcl{display:flex;flex-wrap:wrap;gap:8px}
.wcl span{padding:8px 16px;border-radius:999px;background:#25243A;font-weight:700;animation:pop .5s var(--ease) both;animation-delay:calc(var(--i)*120ms + 300ms)}
.wcl span.me{background:var(--sun);color:#1C1B2E}
.mbars{display:flex;align-items:flex-end;gap:6px;height:150px}
.mbars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font:600 11px var(--display);color:#C9C8D6}
.mbars s{width:100%;border-radius:6px 6px 2px 2px;background:#3A394F;animation:growY .8s var(--ease) both;animation-delay:calc(var(--i)*50ms + 300ms);transform-origin:bottom}
.mbars s.top{background:var(--sun)}
@keyframes growY{from{transform:scaleY(0)}}
.rfoot{display:flex;gap:10px;padding:14px 20px 28px}
.rfoot button{flex:1;height:50px;border-radius:999px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.rfoot .w{background:#F6F5F2;color:#1C1B2E}.rfoot .o{border:1.5px solid #F6F5F2;color:#F6F5F2}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* ===== intro film ===== */
.intro{position:absolute;inset:0;z-index:100;overflow:hidden;background:#0E0D1A;color:#F6F5F2;transition:background-color .9s ease,color .9s ease;--bounce:cubic-bezier(.34,1.56,.64,1)}
.intro[data-tone=light]{background:#F6F5F2;color:#1C1B2E}
.intro[hidden]{display:none}
.ibar{position:absolute;top:22px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:6;width:min(380px,52cqw)}
.ibar i{flex:1;height:3px;border-radius:999px;background:color-mix(in srgb,currentColor 18%,transparent);position:relative;overflow:hidden}
.ibar b{position:absolute;inset:0;background:currentColor;transform:scaleX(0);transform-origin:left}
.ibar i.done b{transform:none}.ibar i.cur b{animation:prog var(--d) linear forwards}
.ibar{left:20px!important;transform:none!important;width:calc(100% - 150px)!important}
.iskip{position:absolute;top:10px;right:14px;z-index:7;height:40px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:700;border:1.5px solid color-mix(in srgb,currentColor 30%,transparent)}
.ihint{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:13px;opacity:.55;margin:0;z-index:5;pointer-events:none;transition:opacity .4s}
.istage{position:absolute;inset:0}
.scn{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:72px 24px 52px;text-align:center}
.hl1{font:700 clamp(26px,4.4cqw,58px)/1.22 var(--display);letter-spacing:-.5px;margin:0;max-width:15em;text-wrap:balance;position:relative;z-index:3}
.enc{color:#5E5D78}.intro[data-tone=light] .enc{color:#B4B2C2}.rev{color:inherit}
/* fragments */
.frags{position:absolute;inset:0;pointer-events:none;transition:opacity .5s}
.fr{position:absolute;display:flex;gap:8px;align-items:center;font-size:clamp(12px,1.3cqw,15px);padding:8px 14px;border-radius:999px;border:1px solid rgba(246,245,242,.2);background:rgba(246,245,242,.04);white-space:nowrap;opacity:0;filter:blur(var(--b));transform:scale(var(--s));animation:drift 7s ease-in-out infinite alternate;transition:left 1.5s cubic-bezier(.7,0,.3,1),top 1.5s cubic-bezier(.7,0,.3,1),opacity 1s,filter 1.5s,transform 1.5s cubic-bezier(.7,0,.3,1)}
.fr.show{opacity:var(--o)}.fr svg.i{width:16px;height:16px;opacity:.7}
@keyframes drift{to{translate:var(--dx) var(--dy);rotate:var(--r)}}
.frags.swirl .fr{left:46%!important;top:48%!important;transform:scale(.25);filter:blur(4px);animation-duration:.4s}
.glitch{animation:glitch .18s steps(2) infinite}
@keyframes glitch{0%{transform:translate(1px,0);text-shadow:-2px 0 #FF5A36,2px 0 #FFB020}50%{transform:translate(-2px,1px);text-shadow:2px 0 #FF5A36,-2px 0 #6E6D85}}
/* pointer highlight */
.ph-wrap{position:relative;display:inline-block;padding:0 .08em}
.ph-layer{position:absolute;inset:0;pointer-events:none;transform-origin:0 0;z-index:4}
.ph-rect{position:absolute;left:0;top:0;border:1.5px solid currentColor}
.ph-rect.coral{border-color:#FF5A36}
.ph-ptr{position:absolute;left:0;top:0;width:22px;height:22px;color:#FF5A36}
.ph-ptr svg{width:100%;height:100%;fill:currentColor;stroke:currentColor;stroke-width:1}
/* cap drop */
.dcap{position:absolute;left:50%;top:50%;width:min(300px,62cqw);translate:-50% -50%;transform-origin:59% 60%;z-index:4}
.dcap svg{width:100%;display:block}
.glow{position:absolute;left:46.9%;top:13.75%;width:14px;height:14px;border-radius:50%;background:#FFB020;translate:-50% -50%;scale:0;transition:scale .5s var(--bounce),box-shadow .6s}
.dcap.lit .glow{scale:1.3;box-shadow:0 0 30px 14px rgba(255,176,32,.55),0 0 90px 40px rgba(255,90,54,.35)}
.lock{display:flex;flex-direction:column;align-items:center;gap:16px}
.lk-cap svg{width:clamp(96px,12cqw,140px);display:block}
.lk-cap{animation:capdrop .9s var(--bounce) both .2s}
@keyframes capdrop{from{transform:translateY(-60cqh) rotate(-12deg)}}
.lk-wm{font:700 clamp(64px,11cqw,132px)/1 var(--brand);letter-spacing:-4px;display:flex}
.lk-wm .cp{color:#E8481F;animation:capdrop .8s var(--bounce) both .55s}
.lk-wm .re{animation:fromL .8s var(--ease) both .45s}.lk-wm .pp{animation:fromR .8s var(--ease) both .45s}
@keyframes fromL{from{transform:translateX(-40px);opacity:0}}@keyframes fromR{from{transform:translateX(40px);opacity:0}}
.lk-tag{font-size:clamp(18px,2.2cqw,26px);line-height:36px;letter-spacing:6px;color:#5A5A6E;margin:0;font-weight:500;min-height:36px}
.lk-sub{font-size:15px;color:#5A5A6E;margin:0;animation:rise .6s var(--ease) both 2.4s}
.icta{margin-top:20px;height:60px;padding:0 44px;border-radius:999px;background:#E8481F;color:#fff;font-size:20px;font-weight:700;animation:rise .6s var(--ease) both 1.2s,pulse 1.8s ease-in-out 2s infinite}
.iagain{margin-top:6px;height:44px;padding:0 16px;font-size:14px;font-weight:700;color:#5A5A6E;text-decoration:underline;text-underline-offset:4px;animation:rise .6s var(--ease) both 1.4s}
/* features */
.feat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:clamp(24px,6cqw,96px);align-items:center;max-width:1040px;width:100%;text-align:left;--mh:min(580px,60cqh)}
.fl{font-size:15px;color:#B8380F;font-weight:700;margin:0 0 12px}
.fsub{font-size:clamp(15px,1.5cqw,19px);line-height:1.7;color:#5A5A6E;margin:16px 0 0;max-width:24em}
.fdots{display:flex;gap:8px;margin-top:28px}.fdots i{width:8px;height:8px;border-radius:999px;background:#D9D6CF;transition:all .4s var(--ease)}.fdots i.on{width:28px;background:#1C1B2E}
.intro .feat{grid-template-columns:1fr;justify-items:center;text-align:center;gap:18px;--mh:min(440px,44cqh)}.intro .fsub{margin-inline:auto}.intro .fdots{justify-content:center;margin-top:14px}
.mk{height:var(--mh);aspect-ratio:1/2;border-radius:2.4em;border:.55em solid #1C1B2E;background:#F6F5F2;position:relative;overflow:hidden;color:#1C1B2E;font-size:calc(var(--mh)/38);text-align:left;box-shadow:0 40px 80px -30px rgba(28,27,46,.4);animation:rise .8s var(--ease) both .2s}
.scr{position:absolute;inset:0;padding:2.6em 1.2em 1.3em;display:flex;flex-direction:column;gap:.9em}
.scr.swap{animation:inR .5s var(--ease) both}
.m-top{text-align:center;font:600 .9em var(--display);color:#5A5A6E}
.m-top.b{font:700 1em var(--sans);color:#1C1B2E}
.m-seg,.m-prog{display:grid;grid-template-columns:repeat(4,1fr);gap:.35em}
.m-seg i,.m-prog i{height:.28em;border-radius:9px;background:#D9D6CF;overflow:hidden}
.m-seg b,.m-prog b{display:block;height:100%;background:#1C1B2E;transform:scaleX(0);transform-origin:left;transition:transform .6s var(--ease)}
.m-prog b{background:#E8481F}
.m-seg i.on b,.m-prog i.on b{transform:none}
.m-q{font-weight:700;font-size:1.35em;line-height:1.35;margin-top:.4em}
.m-q.sw{animation:rise .45s var(--ease)}
.m-body{display:flex;flex-direction:column;gap:.5em}.m-body.sw{animation:inR .45s var(--ease) both}
.m-in{border:.12em solid #1C1B2E;border-radius:.9em;padding:.8em;min-height:4.6em;background:#fff}
.m-caret{display:inline-block;width:.1em;height:1em;background:#E8481F;vertical-align:-.15em;animation:blink .8s infinite}
.m-btn{margin-top:auto;height:3em;border-radius:999px;background:#1C1B2E;color:#F6F5F2;display:grid;place-items:center;font-weight:700;flex:none;transition:background .4s}
.m-btn.co{background:#E8481F;color:#fff;animation:pulse 1.6s infinite}
.m-tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:.5em}
.m-tiles span{border:.1em solid #D9D6CF;border-radius:.8em;padding:.9em .4em;text-align:center;font-weight:700;font-size:.85em;background:#fff;transition:border-color .3s}
.m-tiles span.on{border:.16em solid #1C1B2E;animation:pop .4s var(--ease)}
.m-days{display:grid;grid-template-columns:repeat(7,1fr);row-gap:.3em}
.m-days span{aspect-ratio:1;display:grid;place-items:center;font:500 .85em var(--display);transition:background .3s,color .3s}
.m-days span.r{background:#EDEBE6}.m-days span.e{background:#1C1B2E;color:#F6F5F2;border-radius:50%}
.m-row{display:flex;align-items:center;gap:.6em;border:.1em solid #D9D6CF;border-radius:.8em;padding:.7em .8em;background:#fff;font-weight:700;font-size:.9em;transition:border-color .3s}
.m-row .cb2{margin-left:auto;width:1.3em;height:1.3em;border-radius:.35em;border:.12em solid #D9D6CF;transition:all .3s}
.m-row.on{border-color:#1C1B2E}.m-row.on .cb2{background:#1C1B2E;border-color:#1C1B2E}
.m-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:.6em}
.m-card{border:.1em solid #D9D6CF;border-radius:.9em;padding:.8em;background:#fff;height:6.6em;position:relative;font-weight:700;display:flex;flex-direction:column;justify-content:flex-end;transition:border-color .3s}
.m-card small{display:block;font-size:.72em;color:#5A5A6E;font-weight:500}
.m-card .rg{position:absolute;top:.7em;right:.7em;width:1.5em;height:1.5em;border-radius:50%;border:.12em solid #D9D6CF;display:grid;place-items:center}
.m-card .rg svg{width:.95em;height:.95em;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.m-card.on .rg{background:#E8481F;border-color:#E8481F;animation:pop .45s var(--ease)}.m-card.on .rg svg{opacity:1}
.m-card.on small{color:#B8380F;font-weight:700}
.m-pt{font-size:.8em;font-weight:700}
.m-msg{max-width:84%;padding:.7em .9em;border-radius:1em;font-size:.88em;line-height:1.55;animation:msgIn .4s var(--ease) both}
.m-msg.b{background:#fff;border:.1em solid #D9D6CF;align-self:flex-start;border-bottom-left-radius:.3em}
.m-msg.u{background:#1C1B2E;color:#F6F5F2;align-self:flex-end;border-bottom-right-radius:.3em}
.m-msg .it{opacity:.5}
.m-typing{display:flex;gap:.25em;padding:.9em}.m-typing i{width:.4em;height:.4em;border-radius:50%;background:#5A5A6E;animation:dot 1s infinite}.m-typing i:nth-child(2){animation-delay:.15s}.m-typing i:nth-child(3){animation-delay:.3s}
.m-mic{margin-top:auto;flex:none;display:flex;align-items:center;gap:.6em;padding:.6em .9em;border-radius:999px;background:#fff;border:.12em solid #E8481F;font-size:.85em;font-weight:700}
.m-mic .dt{width:.6em;height:.6em;border-radius:50%;background:#E8481F;animation:blink 1s infinite}
.m-wv{flex:1;display:flex;gap:.16em;align-items:center;height:1.8em}
.m-wv i{flex:1;background:#E8481F;border-radius:9px;height:20%;animation:wv .5s ease-in-out infinite alternate}
@keyframes wv{to{height:100%}}
.m-mic.off{border-color:#D9D6CF}.m-mic.off .dt{background:#D9D6CF;animation:none}.m-mic.off .m-wv i{animation:none;height:14%;background:#D9D6CF}
/* network */
.net{position:relative;width:min(1000px,94cqw);height:min(420px,44cqh);margin-top:clamp(20px,5cqh,56px);transition:opacity .6s}
.net>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.base{fill:none;stroke:rgba(246,245,242,.16);stroke-width:2;stroke-dasharray:100 100;stroke-dashoffset:100}
.pulse{fill:none;stroke:#FF5A36;stroke-width:7;stroke-linecap:round;stroke-dasharray:12 200;stroke-dashoffset:12;filter:url(#glw)}
.core{fill:none;stroke:#FFD48A;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:12 200;stroke-dashoffset:12}
.nd{position:absolute;translate:-50% -50%;transition:left .7s cubic-bezier(.7,0,.3,1),top .7s cubic-bezier(.7,0,.3,1),scale .7s,opacity .7s}
.nd .c{width:clamp(50px,6.4cqw,84px);aspect-ratio:1;border-radius:50%;background:#F6F5F2;color:#1C1B2E;display:grid;place-items:center;box-shadow:0 0 0 6px rgba(246,245,242,.08);transition:box-shadow .25s}
.nd .c svg.i{width:42%;height:42%}
.nd small{position:absolute;top:100%;left:50%;translate:-50% 0;margin-top:10px;white-space:nowrap;font-size:12px;color:#A9A8BE;font-weight:700}
.nd.fire .c{box-shadow:0 0 0 6px rgba(255,90,54,.55),0 0 34px rgba(255,90,54,.7)}
.nd.gone{left:50%!important;top:50%!important;scale:.2;opacity:0}
.hub{position:absolute;left:50%;top:50%;translate:-50% -50%;width:clamp(84px,10cqw,128px);height:clamp(84px,10cqw,128px);border-radius:999px;background:#F6F5F2;display:grid;place-items:center;border:1px solid transparent;box-shadow:0 0 0 8px rgba(246,245,242,.08);z-index:2;cursor:default;transition:width .9s var(--ease),height .9s var(--ease),background-color .9s,box-shadow .9s,border-color .9s,scale .18s}
.hub .hc{transition:opacity .3s,transform .4s;display:grid}.hub .hc svg{width:clamp(48px,6cqw,72px)}
.hub .bt{position:absolute;font:700 clamp(20px,2.5cqw,30px) var(--sans);background:linear-gradient(90deg,#7E7D92 0%,#F6F5F2 30%,#9C9BB0 50%,#F6F5F2 70%,#7E7D92 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;transition:opacity .5s .5s;animation:shim 3s linear infinite;white-space:nowrap}
@keyframes shim{to{background-position:-200% 0}}
.hub.flash{animation:hubf .45s var(--ease)}
@keyframes hubf{40%{box-shadow:0 0 0 14px rgba(255,90,54,.35),0 0 70px rgba(255,176,32,.55)}}
.hub.btn2{width:min(360px,80cqw);height:clamp(66px,9cqh,88px);background:#0A0A0C;border-color:rgba(246,245,242,.18);box-shadow:0 0 140px rgba(255,90,54,.16),0 30px 60px -20px rgba(0,0,0,.9);cursor:pointer}
.hub.btn2 .bt{opacity:1}.hub.btn2 .hc{opacity:0;transform:scale(.3)}
.hub.pressed{scale:.93}
.burst{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid #FFB020;pointer-events:none;z-index:1}
.vbeam{position:absolute;left:62%;top:calc(50% + 46px);width:2px;height:110px;background:linear-gradient(#FF5A36,transparent);opacity:0;transition:opacity 1s .6s}
.cbeam{position:absolute;left:10%;bottom:9%;width:140px;height:190px;opacity:0;transition:opacity 1s .8s;overflow:visible}
.cbeam path{fill:none;stroke:url(#cbg);stroke-width:3;stroke-linecap:round;stroke-dasharray:30 100;animation:beam 3.4s linear infinite}
@keyframes beam{from{stroke-dashoffset:130}to{stroke-dashoffset:0}}
.on-btn .vbeam,.on-btn .cbeam{opacity:1}
.presshint{position:absolute;left:50%;top:calc(50% + clamp(50px,7cqh,64px));translate:-50% 0;font-size:14px;font-weight:700;color:#A9A8BE;white-space:nowrap;animation:rise .5s var(--ease) both}
/* 2D→3D pop */
.pop{position:absolute;left:0;right:0;top:clamp(130px,24cqh,230px);bottom:44px;display:grid;place-items:center;perspective:1400px;z-index:2}
.pg{width:clamp(190px,21cqw,270px);background:#fff;border-radius:20px;color:#1C1B2E;transform-style:preserve-3d;transition:transform 1.4s var(--bounce);position:relative;padding:12px;text-align:left;display:flex;flex-direction:column;gap:10px}
.pg.tilt{transform:rotateX(26deg) rotateY(-34deg) rotateZ(7deg)}
.pg .ly{transition:transform 1.4s var(--bounce);transform-style:preserve-3d}
.pg.tilt .ly{transform:translateZ(var(--z))}
.pg .shd{position:absolute;inset:10% 6% -4%;background:rgba(0,0,0,.6);filter:blur(28px);transform:translateZ(-80px);border-radius:20px;opacity:0;transition:opacity 1s}
.pg.tilt .shd{opacity:1}
.pg .ph3{border-radius:12px;overflow:hidden;aspect-ratio:4/3}
.pg .t3{font-weight:700;font-size:17px;line-height:1.3}
.pg .l3{height:7px;border-radius:9px;background:#E4E1DA;margin-top:6px}
.pg .c3{display:flex;gap:4px;flex-wrap:nowrap}.pg .c3 span{white-space:nowrap;font-size:10px;font-weight:700;padding:3px 7px;border-radius:999px;background:#EDEBE6;display:flex;gap:4px;align-items:center}
.pg .c3 svg.i{width:12px;height:12px}
.ringw{position:absolute;inset:0;display:grid;place-items:center;perspective:1500px;--w:clamp(104px,12.5cqw,156px);--h:calc(var(--w)*1.55);--R:clamp(165px,25cqw,340px)}
.ring{position:relative;width:0;height:0;transform-style:preserve-3d;transform:rotateX(-9deg) translateY(-24px)}
.spin{position:absolute;transform-style:preserve-3d;animation:spinY 18s linear infinite}
@keyframes spinY{to{transform:rotateY(-360deg)}}
.fc{backface-visibility:hidden;position:absolute;left:calc(var(--w)/-2);top:calc(var(--h)/-2);width:var(--w);height:var(--h);transform:rotateY(var(--a)) translateZ(var(--R));transition:transform 1.1s var(--bounce),opacity .5s}
.fc.pre{transform:rotateY(var(--a)) translateZ(0) scale(.15);opacity:0}
.fb2{width:100%;height:100%;border-radius:1em;background:#fff;color:#1C1B2E;overflow:hidden;display:flex;flex-direction:column;gap:.45em;padding:.6em;font-size:calc(var(--w)/13);box-shadow:0 20px 50px -18px rgba(0,0,0,.8)}
.fb2 .ln{height:.42em;border-radius:9px;background:#E4E1DA;flex:none}
.fb2 .hd{display:flex;gap:.4em;align-items:center}.fb2 .av{width:1.3em;height:1.3em;border-radius:50%;background:#E8481F;flex:none}
.fb2 .im{border-radius:.45em;overflow:hidden;flex:none}
.fb2 .row3{display:flex;gap:.35em}.fb2 .row3 i{width:.9em;height:.9em;border-radius:50%;border:.12em solid #1C1B2E}
.fb2 .ttl{font-weight:700;font-size:1.05em;line-height:1.25}
.fb2.story{padding:0;position:relative}
.fb2.story .sc{position:absolute;inset:0}
.fb2.story .bars{position:absolute;top:.5em;left:.5em;right:.5em;display:flex;gap:.25em}.fb2.story .bars i{flex:1;height:.18em;border-radius:9px;background:rgba(255,255,255,.6)}.fb2.story .bars i:first-child{background:#fff}
.fb2.story .cap2{position:absolute;left:.5em;right:.5em;bottom:.7em;background:#fff;border-radius:999px;padding:.35em .6em;font-weight:700;font-size:.8em;text-align:center}
.fb2.env{background:#FDE7DE;justify-content:flex-end;position:relative;padding:.8em}
.fb2.env .flap{position:absolute;left:0;right:0;top:0;height:45%;background:#E8481F;clip-path:polygon(0 0,100% 0,50% 100%)}
.fb2.env .letter{background:#fff;border-radius:.4em;padding:.6em;display:flex;flex-direction:column;gap:.35em}
.fb2.lib .g4{display:grid;grid-template-columns:1fr 1fr;gap:.3em}.fb2.lib .g4>div{aspect-ratio:1;border-radius:.35em;overflow:hidden}
.flab{position:absolute;top:100%;left:-20%;right:-20%;text-align:center;margin-top:12px;font-weight:700;font-size:clamp(12px,1.2cqw,15px);color:#F6F5F2;white-space:nowrap}
/* year */
.yg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;width:min(540px,88cqw);margin-top:28px}
.yg i{aspect-ratio:1;border-radius:14px;background:#EDEBE6;display:flex;align-items:flex-end;padding:8px;font:600 13px var(--display);color:#5A5A6E;font-style:normal;transition:background-color .4s,color .4s,transform .4s var(--bounce)}
.yg i.l1{background:#F6C8B9;color:#1C1B2E}.yg i.l2{background:#F08A6B;color:#1C1B2E}.yg i.l3{background:#E8481F;color:#fff}
.yg i.hit{transform:scale(1.12)}.yg i.fut{background:transparent;border:1.5px dashed #D9D6CF}
.ycount{font:700 clamp(48px,7cqw,84px)/1 var(--display);margin:22px 0 0;letter-spacing:-2px}.ycount small{font-size:.35em;letter-spacing:0;margin-left:6px}
/* publish picker (app) */
.plat{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:16px;background:var(--raised);text-align:left;margin-bottom:8px;transition:border-color .2s}
.plat.on{border:2px solid var(--ink)}
.plat .ico{width:38px;height:38px;border-radius:10px;background:var(--alt);display:grid;place-items:center}
.plat .grow{flex:1}.plat strong{display:block;font-size:15px}.plat small{color:var(--muted);font-size:12px}
.pubs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.pubs span{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--sun);color:#1C1B2E}
.sheet h3{margin:0 0 4px;font-size:20px}.sheet .sub{margin:0 0 14px;color:var(--muted);font-size:14px}

.plat:not(.on) .cb svg{opacity:0}

.phone{container-type:size}

/* photos: IG-style preview + order */
.pv{position:relative;display:block;width:100%;aspect-ratio:4/3;border-radius:16px;overflow:hidden;margin:2px 0 12px}
.pv .sc{position:absolute;inset:0}
.pv .lab{position:absolute;left:10px;bottom:10px;font-size:12px;font-weight:700;letter-spacing:.04em;background:rgba(28,27,46,.62);color:#fff;padding:4px 10px;border-radius:999px}
.pv .zoom{position:absolute;right:10px;bottom:8px;width:36px;height:36px;border-radius:50%;background:rgba(28,27,46,.62);color:#fff;display:grid;place-items:center}
.pv .zoom svg.i{width:18px;height:18px}
.ordw{margin:0 0 12px}
.ordh{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 8px;font-size:13px;font-weight:700;letter-spacing:.04em}.ordh span+span{font-weight:500;color:var(--muted);font-size:12px}
.ord{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none}
.oi{position:relative;flex:none;width:64px;height:64px;border-radius:10px;overflow:hidden;touch-action:none;cursor:grab;transition:transform .2s var(--ease)}
.oi .sc{position:absolute;inset:0}
.oi.drag{z-index:3;transition:none;scale:1.08;box-shadow:0 10px 20px rgba(0,0,0,.3);cursor:grabbing}
.oi b{position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--surface);font:700 11px var(--display);display:grid;place-items:center;letter-spacing:0}
.oi .cv{position:absolute;left:0;right:0;bottom:0;background:var(--coral);color:#fff;font-size:10px;font-weight:700;text-align:center;letter-spacing:.1em;line-height:16px}
.oi.focus{outline:3px solid var(--coral);outline-offset:-3px}
.ph.focus::before{content:"";position:absolute;inset:0;z-index:1;box-shadow:inset 0 0 0 3px var(--coral);border-radius:10px}
.ph .num{z-index:2}
.lb{position:absolute;inset:0;z-index:40;background:#0E0D1A;color:#F6F5F2;display:flex;flex-direction:column;animation:fade .25s both}
.lb .ib{color:#F6F5F2}.lb .ib:hover{background:#2A2940}
.lbt{display:flex;align-items:center;justify-content:space-between;padding:18px 8px 6px;font:600 14px var(--display);letter-spacing:.06em}
.lbc{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;align-items:center}
.lbc::-webkit-scrollbar{display:none}
.lbc>div{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:3/4;max-height:100%}
.lbc .sc{width:100%;height:100%}
.lbf{display:flex;align-items:center;gap:6px;padding:12px 14px 28px}
.lbf .grow{flex:1}
.lbsel{height:44px;padding:0 18px;border-radius:999px;border:1.5px solid #F6F5F2;color:#F6F5F2;font-weight:700;letter-spacing:.08em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.lbsel.on{background:#F6F5F2;color:#1C1B2E}.lbsel b{width:22px;height:22px;border-radius:50%;background:#1C1B2E;color:#F6F5F2;display:grid;place-items:center;font:700 12px var(--display)}
.scan{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;border-radius:12px;overflow:hidden;margin:6px 0 6px}
.scan>div{aspect-ratio:1;animation:scanf 1.6s ease-in-out both;animation-delay:calc(var(--i)*90ms)}
@keyframes scanf{40%{opacity:.35}}
.scan .beam{position:absolute;top:0;bottom:0;width:30%;background:linear-gradient(90deg,transparent,rgba(255,176,32,.55),transparent);animation:sweep 1.2s ease-in-out infinite}
@keyframes sweep{from{left:-30%}to{left:100%}}
.sugs{display:flex;flex-direction:column;gap:8px}
.sug{display:flex;gap:12px;align-items:center;animation:rise .45s var(--ease) both;animation-delay:calc(var(--i,0)*90ms)}
.sth{position:relative;width:54px;height:54px;border-radius:10px;overflow:hidden;flex:none}.sth .sc{position:absolute;inset:0}
.sth b{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--surface);font:700 11px var(--display);display:grid;place-items:center}
.sug strong{display:flex;gap:8px;align-items:center;font-size:15px;letter-spacing:.04em}.sug strong em{font-style:normal;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--alt);color:var(--coral-t);letter-spacing:.06em}
.sug small{display:block;color:var(--muted);font-size:13px;line-height:1.6;letter-spacing:.03em}
.sug.mute .sth{opacity:.55}
.sheet{max-height:92%;overflow-y:auto}
/* text: methods + mix */
.mrow.done{border-color:var(--coral)}.mrow.done .ico{background:var(--coral);color:#fff}.mrow.done small{color:var(--coral-t);font-weight:700}
.mrow.just{animation:glow 1.2s var(--ease) .2s}.mrow.just .ico{animation:pop .5s var(--ease) .3s both}
.mx{border:1.5px solid var(--line);border-radius:16px;background:var(--raised);padding:8px 12px 10px;margin-bottom:10px}
.mx .src{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:var(--coral-t);letter-spacing:.06em}
.mxb{display:flex;gap:2px}.ib.sm{width:36px;height:36px}.ib.sm svg.i{width:18px;height:18px}.ib.sm:disabled{opacity:.25}
.mx textarea{border:0;padding:2px 0 0;background:transparent;border-radius:0;font-size:15px;line-height:1.85;letter-spacing:.04em;overflow:hidden}
.mx textarea:focus{box-shadow:none}
.card:nth-child(3):last-child{grid-column:1/-1;min-height:96px}
/* scenario */
.scen{background:#14132A;color:#F6F5F2;padding-top:28px}
.screen:has(.scen){background:#14132A}
.sc-time{display:flex;align-items:center;gap:10px;font-size:14px;color:#C9C8D6;letter-spacing:.06em}
.sc-time span:first-child{display:flex;gap:6px;align-items:center}.sc-time svg.i{width:16px;height:16px}
.sc-time b{font:700 44px var(--display);color:#F6F5F2;letter-spacing:.02em;margin-right:auto;margin-left:4px}
.bat{width:26px;height:12px;border:1.5px solid #C9C8D6;border-radius:3px;padding:1px;display:inline-flex}.bat i{background:#C9C8D6;border-radius:1px}
.sc-lead{font-size:19px;line-height:1.7;letter-spacing:.04em;margin:14px 0 16px;font-weight:700}
.todo{background:#1F1E38;border-radius:16px;padding:14px 16px}
.todo .lbl{color:#A9A8BE}
.td{display:flex;align-items:center;gap:10px;margin:0;padding:6px 0;font-size:15px;letter-spacing:.04em}
.td.done{color:#8D8CA6}.td.done svg.i{width:18px;height:18px;color:#FF8466}
.td.done s{text-decoration-thickness:1.5px;animation:strike .5s var(--ease) both;animation-delay:calc(var(--i)*180ms + 400ms)}
@keyframes strike{from{text-decoration-color:transparent}}
.td.left{border-top:1px solid #3A394F;margin-top:6px;padding-top:12px;font-weight:700;color:#F6F5F2}
.td.left small{display:block;font-weight:500;font-size:12px;color:#FF8466;letter-spacing:.04em}
.cbx{width:18px;height:18px;border-radius:5px;border:2px solid #FFB020;flex:none;animation:blink 1.6s infinite}
.sc-p{font-size:15px;line-height:1.9;letter-spacing:.04em;color:#D9D8E4;margin:16px 0 0}
.voice{display:block;margin-top:8px;color:#FFB020;font-weight:700}
.sc-lim{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.sc-lim span{display:flex;gap:6px;align-items:center;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid #3A394F;color:#C9C8D6;letter-spacing:.04em;white-space:nowrap}.sc-lim svg.i{width:14px;height:14px}
.sc-task{margin-top:16px;padding:14px 16px;border-radius:16px;border:1.5px solid #FFB020;font-size:15px;line-height:1.8;letter-spacing:.04em}
.tclock{padding:12px 14px;border-radius:14px;background:var(--ink);color:var(--surface);display:flex;flex-direction:column;gap:2px}.tclock b{font-size:15px;letter-spacing:.06em}.tclock span{font-size:12px;opacity:.8;letter-spacing:.04em}
.notion{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap;margin:-8px 0 18px;font-size:14px;font-weight:700}.notion svg.i{width:18px;height:18px;color:var(--coral)}.notion s{animation:strike .8s var(--ease) both .6s}.notion small{width:100%;text-align:center;color:var(--coral-t);font-size:12px}
/* ===== line breaking for Traditional Chinese =====
   keep words whole: break only after punctuation or spaces; balance headings; no single-character last lines */
html{word-break:keep-all;overflow-wrap:break-word;line-break:strict}
body{text-wrap:pretty}
p,.m,.vc,.prose p,.helper,.mnote,.note,.fine,.agree,.sub{text-wrap:pretty}
h1,h2,h3,.hl1,.q,.qq,.pt,.k,.lead,.hint,.fsub,.genmsg,.tr{text-wrap:balance}
.nb{white-space:nowrap}
.range span{white-space:nowrap}.range{font-size:15px;gap:8px;padding-inline:14px}
.btn,.pillbtn,.chip,.sso,.range .tot,.skip,.lnk,.tile,.dl{white-space:nowrap}
.foot .btn{padding-inline:16px}

/* ===== type & spacing spec (CJK needs air) =====
   body 16/28, +0.02em · captions 13/20, +0.03em · headings +0.02em, line-height 1.45
   buttons: primary 56px tall, 16px/700, +0.1em, padding-inline 28px · CTA 19px/700, +0.08em
   pill 36px tall, 13px/700, +0.06em, padding-inline 16px · chip 40px tall, 14px, +0.04em
   one primary action per screen; coral only for that action; ink for the rest */
:root{--ls-body:.02em;--ls-cap:.03em;--ls-head:.02em;--ls-btn:.1em;--ls-pill:.06em;--ls-chip:.04em}
body{letter-spacing:var(--ls-body);line-height:1.75}
.btn{height:56px;padding-inline:28px;letter-spacing:var(--ls-btn);font-size:16px}
.btn.cta{font-size:19px;letter-spacing:.08em}
.pillbtn{height:36px;padding-inline:16px;letter-spacing:var(--ls-pill);gap:6px}
.chip{padding-inline:16px;letter-spacing:var(--ls-chip)}
.skip{letter-spacing:var(--ls-pill)}
h2.q{font-size:23px;line-height:1.5;letter-spacing:var(--ls-head);margin-top:24px}
.home h1{line-height:1.35;letter-spacing:.04em}
.hint,.lead,.capnote,.meta,.ctx,.row small,.card small,.mrow small,.trk small,.plat small{letter-spacing:var(--ls-cap);line-height:1.65}
.top .tt{letter-spacing:.06em}
.tile,.row,.mrow strong,.card strong,.tabs button,.cnt{letter-spacing:.04em}
.m{line-height:1.75;letter-spacing:.03em}
.prose{line-height:1.95;letter-spacing:.04em}
.qq{line-height:1.55;letter-spacing:var(--ls-head)}
.pt{letter-spacing:.03em;line-height:1.4}
.hl1{letter-spacing:.04em;line-height:1.45}
.fsub{letter-spacing:.04em;line-height:1.85}.fl{letter-spacing:.08em}
.icta{letter-spacing:.12em}.hub .bt{letter-spacing:.12em}
.ycard strong,.yban{letter-spacing:.04em}
.tr{letter-spacing:.04em;line-height:1.7}
/* scene 0 */
.sc0{justify-content:flex-start;padding-top:84px;gap:18px;transition:none}
.who{font:700 15px var(--sans);letter-spacing:.2em;color:#A9A8BE;margin:0;min-height:24px}
.pile{position:relative;width:180px;height:216px;margin-top:6px}
.pc0{position:absolute;inset:0;margin:0;background:#F6F5F2;border-radius:10px;padding:8px 8px 0;transform:rotate(var(--r));box-shadow:0 18px 30px -16px rgba(0,0,0,.7)}
.pc0 .sc{height:150px;border-radius:6px}
.pc0 figcaption{color:#1C1B2E;font-size:13px;letter-spacing:.04em;padding:9px 2px;display:flex;gap:8px;font-weight:700}
.pc0 figcaption b{font:600 13px var(--display);color:#B8380F}
.tally{text-align:center}.tally p{margin:0;font-size:16px;letter-spacing:.06em;color:#C9C8D6;line-height:1.9}

const textParts=()=>{if(S.mix&&S.done.text)return S.mix.map(m=>m.t).filter(t=>t.trim());const p=[];S.recall.forEach(t=>t.trim()&&p.push(t.trim()));S.chat.filter(m=>m.u).forEach(m=>p.push(m.t));S.g.forEach(t=>t.trim()&&p.push(t.trim()));if(S.moment&&!S.g[1].trim())p.push(`最想記住的，是${S.moment}。`);if(S.write.trim())p.push(S.write.trim());S.notes.forEach(i=>p.push(NOTES[i][1]));return p};
const METHODS=[['recall','img','看照片回想','一張照片，一個問題'],['chat','chat','聊一聊','像跟朋友聊天一樣慢慢說'],['guide','help','問題引導','用選的回答幾個小問題'],['write','pen','直接寫','已經有想法，直接寫下來'],['find','find','從手機找','把備忘錄、聊天紀錄的原文放進來']];

function rawParts(){const r=[];S.write.trim()&&r.push({src:SRC.write,t:S.write.trim()});S.recall.forEach((t,k)=>t.trim()&&r.push({src:`${SRC.recall}・${PH[(S.photos.length?S.photos:[0,2,6])[k]]??''}`,t:t.trim()}));
 S.chat.filter(m=>m.u).forEach(m=>r.push({src:SRC.chat,t:m.t}));S.notes.forEach(i=>r.push({src:`${SRC.find}・${NOTES[i][0]}`,t:NOTES[i][1]}));
 if(S.g[0].trim())r.push({src:SRC.guide,t:S.g[0].trim()});if(S.g[1].trim())r.push({src:SRC.guide,t:S.g[1].trim()});else if(S.moment)r.push({src:SRC.guide,t:`最想記住的，是${S.moment}。`});if(S.g[2].trim())r.push({src:`${SRC.guide}・結尾`,t:S.g[2].trim()});return r}
function methodStats(){const c={recall:S.recall.filter(t=>t.trim()).length,chat:S.chat.filter(m=>m.u).length,guide:S.g.filter(t=>t.trim()).length+(S.moment&&!S.g[1].trim()?1:0)+(S.words.length?0:0),write:S.write.trim()?1:0,find:S.notes.length};return METHODS.map(([id,ic,t,s2])=>({id,ic,t,s:s2,n:c[id]+(id==='guide'&&S.words.length&&!c.guide?1:0)}))}
function buildMix(){const r=rawParts(),sig=JSON.stringify(r);if(S.mix&&S.mixSig===sig)return;S.mix=r.map(x=>({...x}));S.mixSig=sig}
const OK={q1:()=>!!S.title.trim(),q3:()=>S.end!=null,recall:()=>true,write:()=>!!S.write.trim(),find:()=>S.notes.length>0,chat:()=>S.chat.some(m=>m.u)};

/* rendering + motion */
let curEl=null;
function show(name,dir=1,anim){clearT();S.cur=name;S.dir=dir;const el=document.createElement('section');el.className='screen';el.setAttribute('aria-label',name);el.innerHTML=V[name]();
 const a=anim||(dir>0?'in-r':'in-l');if(curEl&&dir!==0){el.classList.add(a);const old=curEl;old.classList.add(dir>0?'out-l':'out-r');if(a==='in-up')old.classList.remove('out-l');setTimeout(()=>old.remove(),440)}else if(curEl)curEl.remove();
 if(dir<0&&curEl)curEl.style.zIndex=2;phone.appendChild(el);curEl=el;mount(name);navMap();S.just=null}
function refresh(keepScroll=true){if(!curEl)return;S.dir=0;const b=curEl.querySelector('.body'),y=b?b.scrollTop:0;curEl.classList.add('static');curEl.classList.remove('in-r','in-l','in-up');curEl.innerHTML=V[S.cur]();const nb=curEl.querySelector('.body');if(nb&&keepScroll)nb.scrollTop=y;mount(S.cur,true)}
function go(to){if(to==='gen'){show('gen',1);return}show(to,1,to==='recap'?'in-up':null)}
function back(){const p=S.cur==='page'&&S.pageFrom==='lib'?'library':PARENT[S.cur]||'home';show(p,-1)}
function loading(t,done){const sc=document.createElement('div');sc.className='scrim';const sh=document.createElement('div');sh.className='sheet';sh.innerHTML=`<div class="grab"></div><div class="loader" role="status" aria-label="處理中"></div><p style="text-align:center;font-weight:700;letter-spacing:.06em">${esc(t)}</p>`;phone.append(sc,sh);setTimeout(()=>{sc.remove();sh.remove();done()},900)}
function fit(){if(!document.body.classList.contains('present')){phone.style.transform='';return}const k=Math.min((innerHeight-32)/864,(innerWidth-32)/410);phone.style.transform=`scale(${k.toFixed(3)})`}
function present(on){document.body.classList.toggle('present',on);fit();try{if(on&&document.documentElement.requestFullscreen&&!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});if(!on&&document.fullscreenElement)document.exitFullscreen().catch(()=>{})}catch(e){}}
addEventListener('resize',fit);
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('present'))present(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('present')&&document.getElementById('intro').hidden)present(false)});
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;phone.appendChild(d);setTimeout(()=>d.remove(),2500)}
function mount(name,re){
 if(name==='photos')bindOrder();
 if(name==='mix')requestAnimationFrame(()=>curEl.querySelectorAll('textarea[data-mix]').forEach(t=>{t.style.height='auto';t.style.height=t.scrollHeight+'px'}));
 if(name==='chat'){const m=curEl.querySelector('#msgs');m.scrollTop=m.scrollHeight;if(!re&&!S.chat.length)bot(0)}
 if(name==='gen'){const msgs=['照你排的順序放好照片⋯','放進你自己說的話⋯','配上音樂⋯','完成了！'];msgs.slice(1).forEach((t,k)=>later(()=>{const g=curEl.querySelector('#genmsg');if(g)g.innerHTML=`<span>${t}</span>`},(k+1)*800));later(()=>{S.dir=1;S.generated=true;S.view=null;S.pageFrom='flow';show('page',1,'in-up')},3300)}
 if(name==='page'){const c=curEl.querySelector('#car');if(c){const n=c.children.length;c.addEventListener('scroll',()=>{const k=Math.round(c.scrollLeft/c.clientWidth);curEl.querySelector('#cn').textContent=`${k+1} / ${n}`;curEl.querySelectorAll('#cd i').forEach((d,j)=>d.classList.toggle('on',j===k))},{passive:true})}}
 if(name==='recap'){clearT();curEl.querySelectorAll('[data-count]').forEach(el=>{const t=+el.dataset.count,t0=performance.now();const step=now=>{const p=Math.min(1,(now-t0)/1100);el.textContent=Math.round(t*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)});later(()=>{if(S.rs<4){S.rs++;refresh()}},5500)}
}
const TASK={on:false,t0:0,t1:0,done:false};
function tickTask(){const el=document.getElementById('tclock');if(!TASK.on){el.hidden=true;return}el.hidden=false;const el2=(TASK.done?TASK.t1:Date.now())-TASK.t0,min=Math.floor(el2/60000),sec=Math.floor(el2/1000)%60;const now=23*60+3+min,h=Math.floor(now/60)%24,m=now%60,left=25*60-now;
 el.innerHTML=`<b>情境時間 ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}</b><span>${TASK.done?`任務完成，花了 ${min} 分 ${sec} 秒`:`已操作 ${min} 分 ${sec} 秒・離 01:00 還有 ${Math.floor(left/60)} 小時 ${left%60} 分`}</span>`}
setInterval(tickTask,1000);

/* EncryptedText, ported from the React component: scrambles every unrevealed character, reveals one per revealDelayMs, starts when in view */
function encrypt(el,text,{revealDelayMs=50,flipDelayMs=50,charset=CJK,encryptedClassName='enc',revealedClassName='rev'}={}){
 return new Promise(done=>{const chars=[...text];el.setAttribute('aria-label',text);el.setAttribute('role','text');
  const brk=new Set();if(false){let pos=0;const sg=[...SEG.segment(text)];sg.forEach((g,i)=>{pos+=[...g.segment].length;const nx=sg[i+1];if(nx&&nx.isWordLike&&!NOBREAK_AFTER.test(g.segment))brk.add(pos)})}

  const spans=[...el.querySelectorAll('span')];

 const ring=document.createElement('span');ring.className='burst';ring.style.borderColor='#F6F5F2';stg.querySelector('#net').appendChild(ring);ring.animate([{transform:'scale(1)',opacity:.8},{transform:'scale(3.5)',opacity:0}],{duration:700,easing:'ease-out',fill:'forwards'})}

/* scene 5: 2D pops into 3D, then into every place it can go */
const FC=[['IG 貼文',`<div class="fb2"><div class="hd"><i class="av"></i><span class="ln" style="width:50%"></span></div><div class="im" style="aspect-ratio:1">${scene(0)}</div><div class="row3"><i></i><i></i><i></i></div><span class="ln"></span><span class="ln" style="width:70%"></span></div>`],
 ['IG 限動',`<div class="fb2 story">${scene(5)}<div class="bars"><i></i><i></i><i></i></div><div class="cap2">和朋友去花蓮的四天</div></div>`],
 ['FB 貼文',`<div class="fb2"><div class="hd"><i class="av" style="background:#1C1B2E"></i><span class="ln" style="width:55%"></span></div><span class="ln"></span><span class="ln" style="width:80%"></span><div class="im" style="aspect-ratio:16/11">${scene(2)}</div><span class="ln" style="width:40%"></span></div>`],
 ['Medium 文章',`<div class="fb2"><div class="ttl">和朋友去花蓮的四天</div><span class="ln" style="width:45%;background:#F6C8B9"></span><div class="im" style="aspect-ratio:16/9">${scene(1)}</div><span class="ln"></span><span class="ln"></span><span class="ln" style="width:85%"></span><span class="ln"></span><span class="ln" style="width:60%"></span></div>`],
 ['電子報',`<div class="fb2 env"><span class="flap"></span><div class="letter"><b style="font-size:.85em">給重要的你</b><span class="ln"></span><span class="ln" style="width:75%"></span><span class="ln" style="width:55%"></span></div></div>`],
 ['個人 Library',`<div class="fb2 lib"><b style="font:700 1.2em var(--display)">11 月</b><div class="g4"><div>${scene(0)}</div><div>${scene(2)}</div><div>${scene(5)}</div><div>${scene(9)}</div></div><span class="ln" style="width:60%"></span></div>`]];
async function s5(w){chapter(5,13000);const net=stg.querySelector('#net'),nh=stg.querySelector('#nh'),sc=stg.querySelector('#s4'),hub=stg.querySelector('#hub');
 const hb=hub.getBoundingClientRect();
 const pop=document.createElement('div');pop.className='pop';pop.style.top=(nh.getBoundingClientRect().bottom-sc.getBoundingClientRect().top+16)+'px';
 pop.innerHTML=`<div class="pg" id="pg"><span class="shd"></span><div class="ly ph3" style="--z:70px">${scene(6)}</div><div class="ly t3" style="--z:45px">和朋友去花蓮的四天</div><div class="ly" style="--z:25px"><div class="l3"></div><div class="l3" style="width:80%"></div><div class="l3" style="width:60%"></div></div><div class="ly c3" style="--z:95px"><span>${I('img')}照片 3</span><span>${I('music')}音樂</span><span>${I('text')}文字</span></div></div>`;sc.appendChild(pop);
 const pg=pop.querySelector('#pg'),pr=pg.getBoundingClientRect();
 hub.style.visibility='hidden';net.style.transition='opacity .4s';net.style.opacity=0;sc.classList.remove('on-btn');
 const dx=(hb.left+hb.width/2)-(pr.left+pr.width/2),dy=(hb.top+hb.height/2)-(pr.top+pr.height/2);
 pg.animate([{transform:`translate(${dx}px,${dy}px) scale(${hb.width/pr.width},${hb.height/pr.height})`,borderRadius:'60px',backgroundColor:'#0A0A0C'},{transform:'translate(0,0) scale(1.06)',borderRadius:'20px',backgroundColor:'#FFFFFF',offset:.55},{transform:'scale(.97)',offset:.78},{transform:'none',borderRadius:'20px',backgroundColor:'#FFFFFF'}],{duration:950,easing:'cubic-bezier(.2,.8,.2,1)'});
 pg.querySelectorAll('.ly').forEach((l,k)=>l.animate([{opacity:0,translate:'0 14px'},{opacity:1,translate:'0 0'}],{duration:450,delay:420+k*130,easing:'ease-out',fill:'backwards'}));
 fadeOut(nh).then(()=>encrypt(nh,'一鍵，變成完整的一頁。',{revealDelayMs:55}));
 await w(1700);pg.classList.add('tilt');await w(2300);pg.classList.remove('tilt');await w(1100);
 await fadeOut(nh);encrypt(nh,'同一頁，發到各個平台。',{revealDelayMs:50});
 const grid=document.createElement('div');grid.className='deal';grid.innerHTML=FC.map(([l,h])=>`<div class="dt"><div class="dtc">${h}<span class="dck"><svg viewBox="0 0 24 24">${P.check}</svg></span></div><span class="dl">${l}</span></div>`).join('');pop.appendChild(grid);
 const p2=pg.getBoundingClientRect(),cx=p2.left+p2.width/2,cy=p2.top+p2.height/2;
 [...grid.children].forEach((c,k)=>{const r=c.getBoundingClientRect();c.animate([{transform:`translate(${cx-(r.left+r.width/2)}px,${cy-(r.top+r.height/2)}px) scale(.7) rotate(${(k-2.5)*5}deg)`,opacity:0},{opacity:1,offset:.15},{transform:'none',opacity:1}],{duration:850,delay:120+k*90,easing:'cubic-bezier(.34,1.4,.64,1)',fill:'backwards'})});
 pg.animate([{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(.55)'}],{duration:420,easing:'ease-in',fill:'forwards'});
 await w(1800);
 const note=document.createElement('p');note.className='dealnote';note.textContent='勾選平台，一次發佈。';grid.after(note);
 [...grid.children].slice(0,5).forEach((c,k)=>setTimeout(()=>c.classList.add('sent'),200+k*280));
 await w(3400)}

/* scene 6: the year, then the invitation */
async function s6(w){tone('light');chapter(6,6000);
 const mc=MCOUNT.slice();mc[10]=1;const total=mc.reduce((a,b)=>a+b,0);
 stg.innerHTML=`<div class="scn"><h2 class="hl1" id="yh" style="font-size:clamp(26px,4cqw,52px)"></h2><p class="fsub" id="ys" style="text-align:center"></p><div class="yg" id="yg">${mc.map((_,i)=>`<i class="${i===11?'fut':''}">${i+1}</i>`).join('')}</div><p class="ycount"><span id="yc">0</span><small>篇回顧</small></p></div>`;
 encrypt(stg.querySelector('#yh'),'年末，自然看見自己的一年。',{revealDelayMs:55});fadeIn(stg.querySelector('#ys'),'每一次整理都自動存進 Library，串成你的年度故事。');
 const cells=stg.querySelectorAll('#yg i'),yc=stg.querySelector('#yc');let c=0;
 mc.slice(0,11).forEach((n,i)=>setTimeout(()=>{const e=cells[i];if(!e||!e.isConnected)return;e.classList.add(n>=3?'l3':n===2?'l2':n?'l1':'z','hit');setTimeout(()=>e.classList.remove('hit'),300);c+=n;yc.textContent=c},900+i*190));
 await w(4600);
 stg.innerHTML=`<div class="scn"><div class="lock"><div class="lk-cap">${cap(140,'#1C1B2E','#F6F5F2')}</div><div class="lk-wm" aria-label="Recapp"><span class="re">Re</span><span class="cp">cap</span><span class="pp">p</span></div><p class="lk-tag" id="tag"></p><button class="icta" data-iact="end">開始使用</button><button class="iagain" data-iact="again">再看一次</button></div></div>`;
 hint.style.opacity=0;bar.innerHTML='';
 await w(900);await encrypt(stg.querySelector('#tag'),'陪你把日常，整理成文章。',{revealDelayMs:70})}

async function play(){const id=++run;wake&&wake();closeMic();
 box.hidden=false;box.getAnimations().forEach(a=>a.cancel());hint.style.opacity='';stg.innerHTML='';
 const w=ms=>sleep(ms,id);
 try{await s0(w);await s1(w);await s2(w);await s3(w);await s4(w,id);await s5(w);await s6(w)}catch(e){if(e!==ABORT)console.error(e)}}
async function end(){run++;wake&&wake();try{localStorage.setItem('recapp-intro','1')}catch(e){}
 if(!USER.authed&&S.cur!=='auth')show('auth',0);
 const a=box.animate([{clipPath:'circle(150% at 50% 50%)'},{clipPath:'circle(0% at 50% 50%)'}],{duration:800,easing:'cubic-bezier(.7,0,.3,1)'});
 phone.querySelector('.screen')?.animate([{transform:'scale(.92)',opacity:.3},{transform:'scale(1)',opacity:1}],{duration:900,easing:'cubic-bezier(.2,.8,.2,1)',delay:250,fill:'backwards'});
 await a.finished.catch(()=>{});box.hidden=true;stg.innerHTML='';try{phone.querySelector('.btn.cta')?.focus({preventScroll:true})}catch(e){}}
box.addEventListener('click',e=>{const b=e.target.closest('[data-iact]');if(b){const k=b.dataset.iact;if(k==='end'||k==='skip')end();if(k==='again')play();return}if(e.target.closest('button'))return;wake&&wake()});
document.addEventListener('keydown',e=>{if(box.hidden)return;if(e.key==='Escape')end();else if(e.key===' '||e.key==='ArrowRight'){if(document.activeElement&&document.activeElement.id==='hub')return;e.preventDefault();wake&&wake()}});
return {play,end};
})();

{let seen=false;try{seen=localStorage.getItem('recapp-intro')==='1'}catch(e){}
 if(!seen&&!matchMedia('(prefers-reduced-motion: reduce)').matches)Intro.play()}
}
